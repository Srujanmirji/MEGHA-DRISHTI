name: Build MEGHA-DRISHTI Detailed Report PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/Megha_Drishti_Detailed_Report.md"
      - "scripts/build_detailed_report_pdf.py"
      - ".github/workflows/build-detailed-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependency
        run: python -m pip install --upgrade pip reportlab

      - name: Build report
        run: python scripts/build_detailed_report_pdf.py

      - name: Verify PDF
        run: |
          test -s docs/Megha_Drishti_Detailed_Report.pdf
          file docs/Megha_Drishti_Detailed_Report.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Megha_Drishti_Detailed_Report.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Build MEGHA-DRISHTI detailed report PDF"
            git push
          fi
